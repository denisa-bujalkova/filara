<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FILARA – správa obchodu</title>
    <link rel="icon" href="obrazky/logo.jpg" />
    <link rel="stylesheet" href="css/styly.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <!-- Stránka pro správu obchodu. Na webu na ni nic neodkazuje. Data chrání databáze (RLS, je_admin + aal2),
       ne skrytí této stránky. -->
  <body>
    <header class="header">
      <div class="container header-inner">
        <a href="admin.html" class="brand" aria-label="Správa obchodu – začátek">
          <img src="obrazky/logo.jpg" alt="" class="brand-logo" width="44" height="44" />
          <span class="brand-name">FILARA</span>
          <span class="admin-znacka">správa</span>
        </a>
        <nav class="nav" id="admin-menu" aria-label="Menu správy" hidden>
          <a href="#platby">Čeká na platbu</a>
          <a href="#objednavky">Objednávky</a>
          <a href="#sklad">Sklad</a>
        </nav>
        <button type="button" class="btn btn-secondary admin-odhlasit" id="odhlasit" hidden>Odhlásit</button>
      </div>
    </header>

    <main id="admin" class="admin"></main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <noscript>
      <div class="container page"><p>Správa obchodu potřebuje zapnutý JavaScript.</p></div>
    </noscript>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
