<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FILARA – výrobky z 3D tiskárny</title>
    <meta name="description" content="Rodinná dílna vyrábějící originální dekorace, hračky a praktické doplňky na 3D tiskárně." />
    <link rel="icon" href="obrazky/logo.jpg" />
    <link rel="stylesheet" href="css/styly.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a href="#" class="brand" aria-label="Na hlavní stránku">
          <img src="obrazky/logo.jpg" alt="" class="brand-logo" width="44" height="44" />
          <span class="brand-name" data-shop-name></span>
        </a>
        <nav class="nav" aria-label="Hlavní menu">
          <a href="#o-nas">O nás</a>
          <a href="#nabidka">Nabídka</a>
          <a href="#kontakt">Kontakt</a>
        </nav>
        <a href="#kosik" class="cart-link" aria-label="Košík">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 4h2.2l2.1 10.6a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.1" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="9.5" cy="19.5" r="1.3" />
            <circle cx="17" cy="19.5" r="1.3" />
          </svg>
          <span class="cart-label">Košík</span>
          <span class="cart-count" id="pocet-v-kosiku" hidden></span>
        </a>
      </div>
    </header>

    <main id="app"></main>

    <footer class="footer">
      <div class="container footer-inner">
        <div>
          <a href="#" class="brand brand-small">
            <img src="obrazky/logo.jpg" alt="" class="brand-logo" width="32" height="32" />
            <span class="brand-name" data-shop-name></span>
          </a>
          <p>Malá rodinná dílna s velkým kusem srdce v každém výrobku.</p>
        </div>
        <div>
          <p class="footer-title">Kontakt</p>
          <p><a data-shop-email></a></p>
          <p data-shop-phone></p>
        </div>
      </div>
      <p class="footer-copy">© <span id="year"></span> <span data-shop-name></span></p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <noscript><p class="container">Pro zobrazení katalogu povolte v prohlížeči JavaScript.</p></noscript>
    <script src="data/produkty.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
